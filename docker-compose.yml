services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI — guest/guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong:
    image: kong:3.7
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"  # Proxy — all client traffic goes here
      - "8001:8001"  # Admin API
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    depends_on:
      - core
      - persta
      - payments
      - documents

  # ── Platform services (60xx) ─────────────────────────────────────────────────

  core:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: core
    restart: unless-stopped
    ports:
      - "6000:6000"
    env_file: .env
    environment:
      PORT: 6000
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: notifications
    restart: unless-stopped
    ports:
      - "6001:6001"
    env_file: .env
    environment:
      PORT: 6001
    depends_on:
      rabbitmq:
        condition: service_healthy

  documents:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: documents
    restart: unless-stopped
    ports:
      - "6002:6002"
    env_file: .env
    environment:
      PORT: 6002
    depends_on:
      rabbitmq:
        condition: service_healthy

  payments:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: payments
    restart: unless-stopped
    ports:
      - "6003:6003"
    env_file: .env
    environment:
      PORT: 6003
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # ── Verticals (70xx) ─────────────────────────────────────────────────────────

  persta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: persta
    restart: unless-stopped
    ports:
      - "7000:7000"
    env_file: .env
    environment:
      PORT: 7000
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  mongo_data:
  rabbitmq_data:
